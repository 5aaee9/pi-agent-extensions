name: Publish Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check packages
        run: npm run check

      - name: Publish unpublished package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          package_directories=(
            "pi-provider-sub2api"
            "pi-continue"
          )
          published_count=0

          for directory in "${package_directories[@]}"; do
            package_name="$(node -p "require('./$directory/package.json').name")"
            package_version="$(node -p "require('./$directory/package.json').version")"
            package_spec="$package_name@$package_version"
            view_stdout="$(mktemp)"
            view_stderr="$(mktemp)"

            if npm view "$package_spec" version --json >"$view_stdout" 2>"$view_stderr"; then
              echo "::notice::$package_spec is already published; skipping"
              rm -f "$view_stdout" "$view_stderr"
              continue
            fi

            if ! grep -qE "E404|404 Not Found" "$view_stderr"; then
              cat "$view_stdout" "$view_stderr" >&2
              rm -f "$view_stdout" "$view_stderr"
              exit 1
            fi

            rm -f "$view_stdout" "$view_stderr"
            npm publish --workspace "$package_name" --access public
            published_count=$((published_count + 1))
          done

          if [ "$published_count" -eq 0 ]; then
            echo "Tag $RELEASE_TAG has no unpublished package versions" >&2
            exit 1
          fi
