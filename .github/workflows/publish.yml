name: Publish Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag matching the synchronized package version
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check packages
        run: npm run check

      - name: Publish unpublished package versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          package_directories=(
            "pi-provider-sub2api"
            "pi-continue"
          )
          release_version="${RELEASE_TAG#v}"

          if [ -z "$release_version" ] || [ "$release_version" = "$RELEASE_TAG" ]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          npm run check:versions -- "$release_version"

          publish_directories=()

          for directory in "${package_directories[@]}"; do
            package_name="$(node -p "require('./$directory/package.json').name")"
            package_version="$(node -p "require('./$directory/package.json').version")"
            package_spec="$package_name@$package_version"
            view_stdout="$(mktemp)"
            view_stderr="$(mktemp)"

            if npm view "$package_spec" version --json >"$view_stdout" 2>"$view_stderr"; then
              echo "::notice::$package_spec is already published; skipping"
              rm -f "$view_stdout" "$view_stderr"
              continue
            fi

            if ! grep -qE "E404|404 Not Found" "$view_stderr"; then
              cat "$view_stdout" "$view_stderr" >&2
              rm -f "$view_stdout" "$view_stderr"
              exit 1
            fi

            rm -f "$view_stdout" "$view_stderr"
            publish_directories+=("$directory")
          done

          if [ "${#publish_directories[@]}" -eq 0 ]; then
            echo "Tag $RELEASE_TAG has no unpublished package versions" >&2
            exit 1
          fi

          for directory in "${publish_directories[@]}"; do
            package_name="$(node -p "require('./$directory/package.json').name")"
            npm publish --workspace "$package_name" --access public
          done
