name: Publish Packages

# Publishes every package version that is absent from npm, built from the
# commit that introduced it, then records each published version with a tag
# and GitHub Release. The procedure is in docs/releases.md. The npm trusted
# publishers are bound to this file name; do not rename it.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Publish Packages runs only on refs/heads/main, not $GITHUB_REF"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Install the browser for real-environment tests
        run: npx playwright install --with-deps chromium

      - name: Check repository
        run: npm run check

      - name: Plan publication
        id: plan
        run: node scripts/release/plan.ts --out "$RUNNER_TEMP/release-batch"

      - name: Upload release batch
        if: steps.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-batch
          path: ${{ runner.temp }}/release-batch
          if-no-files-found: error

  publish:
    name: Publish and record
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Download release batch
        uses: actions/download-artifact@v8
        with:
          name: release-batch
          path: ${{ runner.temp }}/release-batch

      - name: Publish and record
        run: node scripts/release/publish.ts --dir "$RUNNER_TEMP/release-batch"
